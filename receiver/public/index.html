<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incident reports</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/vendor/rrweb-player.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐛</text></svg>"
    />
  </head>
  <body>
    <!-- Token gate. The API needs an Authorization header, which a browser
         address bar can't send, so the token is pasted once and kept in
         localStorage for this browser only. -->
    <div id="gate" class="gate" hidden>
      <form id="gate-form" class="gate-card">
        <h1>Incident reports</h1>
        <p class="muted">
          Paste the staff API token (<code>STAFF_API_TOKEN</code> from the
          pipeline <code>.env</code>). It stays in this browser.
        </p>
        <input
          id="token-input"
          type="password"
          placeholder="staff API token"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">Unlock</button>
        <p id="gate-error" class="error" hidden></p>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <h1>Incident reports</h1>
        <div class="topbar-controls">
          <input id="search" type="search" placeholder="Search note, URL, reporter…" />
          <select id="app-filter"><option value="">All apps</option></select>
          <select id="source-filter">
            <option value="">All sources</option>
            <option value="staff-report">Staff reports</option>
            <option value="auto-error">Auto-captured</option>
          </select>
          <button id="refresh" type="button" title="Reload">Refresh</button>
          <button
            id="theme-toggle"
            type="button"
            class="ghost"
            title="Switch between light, dark, and your system setting"
          >
            Theme
          </button>
          <button id="forget" type="button" class="ghost" title="Forget token">Lock</button>
        </div>
      </header>

      <main class="layout">
        <ul id="list" class="list" aria-label="Reports"></ul>
        <section id="detail" class="detail">
          <p class="empty">Select a report.</p>
        </section>
      </main>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close">✕</button>
      <button id="lightbox-prev" class="lightbox-nav prev" type="button" aria-label="Previous frame">‹</button>
      <img id="lightbox-img" alt="" />
      <button id="lightbox-next" class="lightbox-nav next" type="button" aria-label="Next frame">›</button>
      <p id="lightbox-caption" class="lightbox-caption"></p>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
