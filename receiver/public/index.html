<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentinel</title>
    <!-- This page is served at two roots on purpose (src/index.js) — under
         /sentinel behind the shared origin, and at the bare root standalone
         on its own port — which is why every asset reference below is
         relative rather than hardcoded to one or the other.
         That stopped being enough once routes could nest: relative
         resolution drops only the last path segment, so it works by
         accident at /sentinel/issues (one segment) and breaks at
         /sentinel/settings/apps/:app (two) — silently for a stylesheet, as a
         blank page with no error for app.js, since nothing after a failed
         module load ever runs.

         Both values below are filled in by src/index.js's renderShell()
         with whichever root actually matched — the meta tag is app.js's
         copy, read once at boot instead of recomputed from location.pathname
         with its own separate rule. Two implementations of "which root is
         this" is how they drift; one that only the server decides, and the
         client only reads, cannot. The href needs no script to run before it
         takes effect either way — a client-side fix would have needed one,
         and this app's own CSP (script-src 'self', no unsafe-inline) refuses
         to run an inline one. -->
    <meta name="sentinel-mount" content="__SENTINEL_MOUNT__" />
    <base href="__SENTINEL_BASE__" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vendor/rrweb-player.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛡️</text></svg>"
    />
  </head>
  <body>
    <!-- Signing in, registering, resetting a password, the second factor,
         and "you're in no organisation yet" were all blocks of markup here,
         unhidden one at a time. They are addresses now (views/auth.js), for
         a reason the reset flow settles on its own: allauth emails a link
         carrying a key, and a link has to land on a URL. -->

    <div id="app">
      <!-- Navigation is a sidebar, the way GlitchTip's is, because that is
           the shape people already know and because a row of tabs stops
           working once there is more than a handful of destinations.

           Only real ones are here. GlitchTip's own nav also carries Uptime,
           Logs, Performance, Releases and Projects; those are later phases
           and a link to a screen that does not exist is worse than no link,
           so they arrive with the screens rather than ahead of them. -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">
          <a id="home-link" href="/">Sentinel</a>
          <!-- One organisation: its name. Several: a way to change which one
               you are looking at, because otherwise the others have no
               address at all. -->
          <span id="org-name" class="muted" hidden></span>
          <select id="org-switch" class="org-switch" aria-label="Organisation" hidden></select>
        </div>

        <nav class="sidebar-nav" aria-label="Sections">
          <a id="nav-issues" href="/issues">Issues</a>
          <!-- Internal since Phase 4: a project's keys, alerts and
               environments alongside its reports and origins, rather than a
               link across to half of that. -->
          <a id="nav-projects" href="/projects">Projects</a>
          <!-- Members and the queue of people asking to be one, which were
               two screens answering the same question. -->
          <a id="nav-people" href="/people">People</a>
          <a id="nav-reports" href="/">Reports</a>
          <a id="nav-settings" href="/settings">Settings</a>
        </nav>

        <!-- The rest of the product, which is still GlitchTip's own screens.
             They are real destinations today; each becomes an internal route
             as its phase lands, and until then a link that works beats a
             section of the app you cannot reach at all. Uptime and Logs are
             optional features, so they appear only where they are switched
             on. -->
        <nav class="sidebar-nav sidebar-external" aria-label="In GlitchTip">
          <h2 id="nav-external-heading" class="sidebar-heading" hidden>In GlitchTip</h2>
          <a id="nav-performance" target="_blank" rel="noreferrer noopener" hidden>Performance ↗</a>
          <a id="nav-uptime" target="_blank" rel="noreferrer noopener" hidden>Uptime ↗</a>
          <a id="nav-logs" target="_blank" rel="noreferrer noopener" hidden>Logs ↗</a>
          <a id="nav-releases" target="_blank" rel="noreferrer noopener" hidden>Releases ↗</a>
          <a id="nav-org-settings" target="_blank" rel="noreferrer noopener" hidden>Organisation ↗</a>
          <a id="nav-profile" target="_blank" rel="noreferrer noopener" hidden>Your profile ↗</a>
        </nav>

        <div class="sidebar-foot">
          <a id="glitchtip-link" class="button-link" target="_blank" rel="noreferrer noopener" hidden>
            GlitchTip ↗
          </a>
          <button
            id="theme-toggle"
            type="button"
            class="ghost"
            title="Switch between light, dark, and your system setting"
          >
            Theme
          </button>
          <button id="forget" type="button" class="ghost" title="Sign out">Sign out</button>
        </div>
      </aside>

      <div class="content">
        <!-- What the *page* is, as opposed to where you are in the app: the
             breadcrumb and the one control that acts on what is shown. -->
        <header id="topbar" class="topbar">
          <h1 id="app-title"><span id="crumb" class="breadcrumb" hidden></span></h1>
          <button id="refresh" type="button" title="Reload">Refresh</button>
        </header>

      <!-- Where every routed screen renders: the landing grid of app cards
           (views/projects.js), one app's reports and the report itself
           (views/reports.js). Dialogs like requests and settings layer over
           whatever is here rather than replacing it.

           The reports list and detail had their own <main> beside this one,
           swapped by hand; the screenshot lightbox was a third block down
           here, filled in by whichever screen opened it. Both belong to the
           screen that shows them, and now live there — the lightbox is
           built and appended by the view, and goes away with it. -->
        <main id="view" hidden></main>
      </div>
    </div>

    <!-- Relative, resolved by the <base> tag in <head> like the stylesheets.
         Its own imports (./lib/router.js and so on) are fine either way —
         module specifiers resolve against this script's own URL, not the
         page's, so they'd have worked even without the fix above.

         Which file this is gets filled in by src/index.js: the bundle when
         the build produced one, the entry module when it didn't. Running the
         receiver straight from a checkout is a normal thing to do, and it
         should not be a blank page because a build step wasn't run. -->
    <script src="__SENTINEL_SCRIPT__" type="module"></script>
  </body>
</html>
