version: "3.9"

# ---------------------------------------------------------------------------
# Error Monitoring & Bug Reporting Pipeline
# Self-hosted stack: GlitchTip (errors) + feedback/incident receiver + Caddy
# ---------------------------------------------------------------------------
# Copy .env.example to .env and fill in real values before running:
#   docker compose up -d
# ---------------------------------------------------------------------------

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
  PORT: 8000
  EMAIL_URL: ${EMAIL_URL}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  CELERY_WORKER_AUTOSCALE: "1,3"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
  ENABLE_OPEN_USER_REGISTRATION: "false"
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    environment:
      <<: *glitchtip-env
    command: ./manage.py migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    environment:
      <<: *glitchtip-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    volumes:
      - glitchtip_uploads:/code/uploads

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      <<: *glitchtip-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    volumes:
      - glitchtip_uploads:/code/uploads

  feedback-receiver:
    build: ./receiver
    restart: unless-stopped
    environment:
      PORT: 4000
      DATA_DIR: /data
      STAFF_API_TOKEN: ${STAFF_API_TOKEN}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MAX_UPLOAD_MB: "8"
    volumes:
      - receiver_data:/data
    depends_on:
      - glitchtip-web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8000:8000" # GlitchTip — http://<host>:8000
      - "4000:4000" # feedback receiver — http://<host>:4000
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - glitchtip-web
      - feedback-receiver

volumes:
  postgres_data:
  redis_data:
  glitchtip_uploads:
  receiver_data:
  caddy_data:
  caddy_config:
