# ---------------------------------------------------------------------------
# Sentinel — error monitoring and bug reporting pipeline
# Self-hosted stack: GlitchTip (errors) + Sentinel receiver/viewer + Caddy
# ---------------------------------------------------------------------------
# Copy .env.example to .env and fill in real values before running:
#   docker compose up -d
# ---------------------------------------------------------------------------

# GlitchTip is pinned by digest, not by tag: Sentinel's UI reads its API
# directly, so what we run has to be exactly what was tested. Upgrading is
# deliberate — change the digest, run `npm run smoke` in receiver/, then merge.
# Currently GlitchTip 6.2.6.
x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
  PORT: 8000
  EMAIL_URL: ${EMAIL_URL}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  CELERY_WORKER_AUTOSCALE: "1,3"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
  # Two separate settings, easily confused. ENABLE_OPEN_USER_REGISTRATION
  # governs creating *organisations*; ENABLE_USER_REGISTRATION governs
  # creating *accounts*.
  #
  # Accounts stay open, because closing them deadlocks onboarding:
  # GlitchTip refuses to invite an email that has no account yet ("Only
  # existing users may be invited"), so with registration off you can only
  # invite people who somehow already registered. A stranger who signs up
  # belongs to no organisation, which means GlitchTip shows them nothing
  # and Sentinel refuses them outright — membership is what grants access,
  # not having an account.
  # The name GlitchTip calls itself where it can be told to — its admin
  # header, and the settings its own frontend reads. Sentinel is the product
  # people are using; GlitchTip is the engine underneath.
  GLITCHTIP_INSTANCE_NAME: "${INSTANCE_NAME:-Sentinel}"
  ENABLE_OPEN_USER_REGISTRATION: "${ENABLE_OPEN_USER_REGISTRATION:-false}"
  ENABLE_USER_REGISTRATION: "${ENABLE_USER_REGISTRATION:-true}"
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-migrate:
    image: glitchtip/glitchtip@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    environment:
      <<: *glitchtip-env
    command: ./manage.py migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  glitchtip-web:
    image: glitchtip/glitchtip@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    restart: unless-stopped
    environment:
      <<: *glitchtip-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    volumes:
      - glitchtip_uploads:/code/uploads
      # Adds a "Bug reports in Sentinel" link to GlitchTip's UI, which ships
      # as a prebuilt image with nowhere to configure one. This file is a
      # patched copy of the image's own SPA shell and references its
      # hash-named JS bundles, so it MUST be regenerated after every
      # GlitchTip upgrade or GlitchTip will fail to load:
      #   ./scripts/patch-glitchtip-index.sh --check
      - ./glitchtip/index.html:/code/dist/index.html:ro

  glitchtip-worker:
    image: glitchtip/glitchtip@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      <<: *glitchtip-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    volumes:
      - glitchtip_uploads:/code/uploads

  feedback-receiver:
    build: ./receiver
    restart: unless-stopped
    environment:
      PORT: 4000
      DATA_DIR: /data
      STAFF_API_TOKEN: ${STAFF_API_TOKEN}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MAX_UPLOAD_MB: "8"
      # Sign-in: GlitchTip org membership decides who may read reports.
      # GLITCHTIP_URL goes into links staff click, so it must be reachable
      # from their browser; the API call is made container-to-container.
      GLITCHTIP_URL: ${GLITCHTIP_DOMAIN}
      GLITCHTIP_API_URL: http://glitchtip-web:8000
      GLITCHTIP_ORG: ${GLITCHTIP_ORG}
      GLITCHTIP_PROJECT_MAP: ${GLITCHTIP_PROJECT_MAP}
      # Creates a GlitchTip project the first time a new app reports, so
      # nobody has to make one by hand. Give this token project:write and
      # NOT project:admin — creating needs the first, deleting needs the
      # second, so a leaked token can't cost you a project's history.
      GLITCHTIP_SERVICE_TOKEN: ${GLITCHTIP_SERVICE_TOKEN:-}
      GLITCHTIP_TEAM: ${GLITCHTIP_TEAM:-}
      # Signed session cookies. Without this, everyone is signed out on
      # every restart.
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      # Set once there's TLS in front: session cookies then refuse to travel
      # over plain HTTP. Leave false on a bare-IP deployment or nobody can
      # sign in at all.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      RETENTION_MAX_MB: ${RETENTION_MAX_MB:-5120}
      RETENTION_SWEEP_MINUTES: ${RETENTION_SWEEP_MINUTES:-360}
    volumes:
      - receiver_data:/data
    depends_on:
      - glitchtip-web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Published ports are configurable because a shared server often has
    # something on 8000 already. Only the left-hand side moves: Caddy still
    # listens on 8000 and 4000 inside the network, so the Caddyfile and every
    # container-to-container URL stay as they are. Change GLITCHTIP_PORT and
    # GLITCHTIP_DOMAIN together — GlitchTip builds DSNs and email links from
    # the domain, so a mismatch produces DSNs nothing can reach.
    ports:
      - "${GLITCHTIP_PORT:-8000}:8000" # GlitchTip — http://<host>:<GLITCHTIP_PORT>
      - "${SENTINEL_PORT:-4000}:4000"  # Sentinel  — http://<host>:<SENTINEL_PORT>
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - glitchtip-web
      - feedback-receiver

volumes:
  postgres_data:
  redis_data:
  glitchtip_uploads:
  receiver_data:
  caddy_data:
  caddy_config:
